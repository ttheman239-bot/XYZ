<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Graphics Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>2D Graphics Playground</h1>
    <div class="controls">
      <button data-scene="particles">Particles</button>
      <button data-scene="bouncing">Bouncing Balls</button>
      <button data-scene="fractal">Fractal Tree</button>
      <button data-scene="waves">Waves</button>
    </div>
  </header>
  <main>
    <canvas id="stage" width="960" height="600"></canvas>
  </main>
  <script src="main.js"></script>
</body>
</html>
