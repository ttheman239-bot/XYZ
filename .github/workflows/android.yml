name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "::group::env"
          uname -a
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la
          echo "::endgroup::"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute version slug
        id: slug
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Build APKs (debug + release)
        id: build
        continue-on-error: true
        run: |
          mkdir -p logs
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --info 2>&1 | tee logs/gradle-build.log

      - name: Stage release artifacts
        id: stage
        run: |
          mkdir -p artifacts
          # Always include the build log for diagnosis
          cp logs/gradle-build.log "artifacts/build-${{ steps.slug.outputs.slug }}.log" 2>/dev/null || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "artifacts/xyz-debug-${{ steps.slug.outputs.slug }}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/xyz-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "artifacts/xyz-release-${{ steps.slug.outputs.slug }}.apk"
            cp app/build/outputs/apk/release/app-release.apk artifacts/xyz-release.apk
          fi
          ls -la artifacts/

      - name: Upload artifacts (APKs + log)
        uses: actions/upload-artifact@v4
        with:
          name: xyz-build-${{ steps.slug.outputs.slug }}
          path: |
            artifacts/*.apk
            artifacts/*.log
          if-no-files-found: warn

      - name: Publish rolling "nightly" Release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly build
          tag_name: nightly
          prerelease: true
          make_latest: "true"
          body: |
            Auto-published from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Build status of last run: **${{ steps.build.outcome }}**.
            If the APKs are missing, the attached `build-*.log` contains the gradle output.
          files: |
            artifacts/*.apk
            artifacts/*.log

      - name: Create GitHub Release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.log

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "Gradle build failed; see attached log."
          tail -200 logs/gradle-build.log || true
          exit 1
