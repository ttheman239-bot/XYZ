name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute version slug
        id: slug
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/xyz-debug-${{ steps.slug.outputs.slug }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/xyz-release-${{ steps.slug.outputs.slug }}.apk"
          # Unversioned aliases so /releases/latest/download/<name>.apk always resolves.
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/xyz-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/xyz-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xyz-apks-${{ steps.slug.outputs.slug }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk

      - name: Publish rolling "nightly" Release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly build
          tag_name: nightly
          prerelease: true
          make_latest: "true"
          body: |
            Auto-published from `${{ github.ref_name }}` @ ${{ github.sha }}.
            This release is overwritten on every push — pin a `v*` tag for an immutable build.
          files: artifacts/*.apk
