name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Also attach the APK to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with run number
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/graphics2d-debug-r${{ github.run_number }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphics2d-debug-apk-r${{ github.run_number }}
          path: android-app/app/build/outputs/apk/debug/graphics2d-debug-r${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a GitHub Release
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-r${{ github.run_number }}
          name: "Android debug build r${{ github.run_number }}"
          body: |
            Debug APK built from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: android-app/app/build/outputs/apk/debug/graphics2d-debug-r${{ github.run_number }}.apk
          fail_on_unmatched_files: true
